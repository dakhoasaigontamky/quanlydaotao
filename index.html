<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý đào tạo - Bệnh viện Đa khoa Sài Gòn Tam Kỳ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    --bg:#F5F6F2;
    --panel:#FFFFFF;
    --ink:#1B2E2A;
    --muted:#6B7A74;
    --line:#DDE3DD;
    --accent:#2F6F5E;
    --accent-dark:#234F42;
    --gold:#B8863C;
    --danger:#B54D3F;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;line-height:1.5;}
  h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:600;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:380px;}
  .login-mark{font-family:'Source Serif 4',serif;font-size:15px;color:var(--accent-dark);letter-spacing:.02em;margin-bottom:6px;}
  .login-box h1{font-size:26px;color:var(--ink);margin-bottom:6px;}
  .login-sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
  .field-label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .login-box input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:16px;letter-spacing:.03em;background:var(--panel);color:var(--ink);}
  .login-box input:focus{outline:none;border-color:var(--accent);}
  .btn-primary{margin-top:16px;width:100%;padding:11px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14.5px;font-weight:500;}
  .btn-primary:hover{background:var(--accent-dark);}
  .login-error{margin-top:14px;font-size:13.5px;color:var(--danger);display:none;}

  /* ---------- App shell ---------- */
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .sidebar-mark{padding:22px 20px 18px;border-bottom:1px solid var(--line);}
  .sidebar-mark .title{font-family:'Source Serif 4',serif;font-size:17px;font-weight:600;}
  .sidebar-mark .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  nav.nav{flex:1;padding:14px 10px;}
  .nav-item{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-radius:var(--radius);font-size:14px;color:var(--ink);margin-bottom:2px;}
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent);color:#fff;}
  .nav-item.disabled{color:#B7BEBA;cursor:default;}
  .nav-item.disabled:hover{background:none;}
  .sidebar-user{border-top:1px solid var(--line);padding:14px 20px;}
  .sidebar-user .name{font-size:13.5px;font-weight:500;}
  .sidebar-user .role{font-size:12px;color:var(--muted);margin-top:1px;}
  .sidebar-user button{margin-top:10px;background:none;border:1px solid var(--line);border-radius:var(--radius);padding:6px 10px;font-size:12.5px;color:var(--muted);}
  .sidebar-user button:hover{border-color:var(--danger);color:var(--danger);}

  .main{flex:1;padding:32px 40px;max-width:1040px;}
  .main h2{font-size:22px;margin-bottom:4px;}
  .main .desc{color:var(--muted);font-size:13.5px;margin-bottom:26px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:500;font-size:12.5px;}
  tr:last-child td{border-bottom:none;}
  .role-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;}
  .role-tag.admin{background:#EFE3CF;color:var(--gold);}
  .role-tag.hoc_vien{background:#E1EBE7;color:var(--accent-dark);}
  .row-actions button{background:none;border:none;color:var(--muted);font-size:12.5px;margin-right:10px;padding:0;}
  .row-actions button:hover{color:var(--accent-dark);text-decoration:underline;}
  .row-actions button.del:hover{color:var(--danger);}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .btn-add{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:9px 16px;font-size:13.5px;font-weight:500;}
  .btn-add:hover{background:var(--accent-dark);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px;border-bottom:1px solid var(--line);}
  .form-grid .full{grid-column:1/-1;}
  .form-grid label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .form-grid input,.form-grid select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;background:#fff;color:var(--ink);}
  .form-actions{grid-column:1/-1;display:flex;gap:10px;margin-top:2px;}
  .btn-save{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:8px 16px;font-size:13.5px;}
  .btn-cancel{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:8px 16px;font-size:13.5px;color:var(--muted);}
  .form-err{grid-column:1/-1;color:var(--danger);font-size:13px;display:none;}

  .empty-panel{padding:60px 20px;text-align:center;color:var(--muted);}
  .empty-panel .glyph{font-family:'Source Serif 4',serif;font-size:34px;color:var(--line);margin-bottom:10px;}
  .empty-panel p{max-width:320px;margin:0 auto;font-size:13.5px;}

  .profile-panel{padding:26px 28px;max-width:460px;}
  .profile-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .profile-row:last-child{border-bottom:none;}
  .profile-row .k{color:var(--muted);}
  .profile-row .v{font-weight:500;}

  .status-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;}
  .status-tag.sap_dien_ra{background:#E8EDE3;color:#5C7047;}
  .status-tag.dang_dien_ra{background:#E1EBE7;color:var(--accent-dark);}
  .status-tag.da_xong{background:#EDEDEA;color:var(--muted);}

  .tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{background:none;border:none;padding:9px 14px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:500;}

  .course-card{padding:18px 20px;border-bottom:1px solid var(--line);}
  .course-card:last-child{border-bottom:none;}
  .course-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .course-card .ten{font-size:15.5px;font-weight:600;font-family:'Source Serif 4',serif;}
  .course-card .meta{color:var(--muted);font-size:12.5px;margin-top:4px;}
  .course-card .mota{font-size:13.5px;margin-top:8px;color:var(--ink);}

  .cert-status{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;}
  .cert-status.cho_duyet{background:#F3E9D2;color:#8A6A1F;}
  .cert-status.da_duyet{background:#E1EBE7;color:var(--accent-dark);}
  .cert-status.tu_choi{background:#F3DFDA;color:var(--danger);}
  .exp-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;margin-left:6px;}
  .exp-badge.expired{background:#F3DFDA;color:var(--danger);}
  .exp-badge.soon{background:#F3E9D2;color:#8A6A1F;}
  .cert-card{padding:16px 20px;border-bottom:1px solid var(--line);}
  .cert-card:last-child{border-bottom:none;}
  .cert-card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .cert-card .ten{font-size:15px;font-weight:600;font-family:'Source Serif 4',serif;}
  .cert-card .meta{color:var(--muted);font-size:12.5px;margin-top:4px;}

  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .kpi-card .val{font-family:'Source Serif 4',serif;font-size:28px;font-weight:600;color:var(--accent-dark);}
  .kpi-card .val.warn{color:var(--gold);}
  .kpi-card .val.bad{color:var(--danger);}
  .kpi-card .lbl{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .bar-row{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line);}
  .bar-row:last-child{border-bottom:none;}
  .bar-row .name{width:190px;flex-shrink:0;font-size:13px;}
  .bar-track{flex:1;height:10px;background:var(--bg);border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:20px;}
  .bar-row .pct{width:60px;text-align:right;font-size:12.5px;color:var(--muted);flex-shrink:0;}
  .settings-row{display:flex;gap:14px;align-items:end;padding:16px 20px;flex-wrap:wrap;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-mark">Bệnh viện Đa khoa Sài Gòn Tam Kỳ</div>
    <h1>Quản lý đào tạo</h1>
    <p class="login-sub">Nhập mã số nhân viên để vào hệ thống.</p>
    <label class="field-label" for="ma-so-input">Mã số nhân viên</label>
    <input id="ma-so-input" type="text" placeholder="VD: DKTK0163" autocomplete="off">
    <div id="pw-login-wrap" style="display:none;margin-top:14px;">
      <label class="field-label" for="mat-khau-input">Mật khẩu</label>
      <input id="mat-khau-input" type="password" autocomplete="off">
      <label style="display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted);">
        <input type="checkbox" style="width:auto;" onchange="document.getElementById('mat-khau-input').type = this.checked ? 'text' : 'password'"> Hiện mật khẩu
      </label>
    </div>
    <button class="btn-primary" onclick="handleLogin()">Đăng nhập</button>
    <p class="login-error" id="login-error">Không tìm thấy mã số nhân viên này. Vui lòng liên hệ quản trị viên để được cấp mã.</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pqceeqcutkphvmyqsmyt.supabase.co';

async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(errText || `Lỗi kết nối (${res.status})`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// ---------- Helper đọc file Excel ----------
function normKey(k) {
  return String(k).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function readExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws, { defval: '' }));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(new Error('Không đọc được file.'));
    reader.readAsArrayBuffer(file);
  });
}

function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

async function handleLogin() {
  const input = document.getElementById('ma-so-input');
  const errEl = document.getElementById('login-error');
  const pwWrap = document.getElementById('pw-login-wrap');
  const code = input.value.trim().toUpperCase();
  const mk = document.getElementById('mat-khau-input').value.trim();
  errEl.style.display = 'none';
  if (!code) return;
  try {
    const rows = await sb('rpc/dt_login', { method: 'POST', body: JSON.stringify({ p_ma_so: code, p_mat_khau: mk || null }) });
    if (!rows || rows.length === 0) {
      errEl.textContent = 'Không tìm thấy mã số nhân viên này. Vui lòng liên hệ quản trị viên để được cấp mã.';
      errEl.style.display = 'block';
      return;
    }
    currentUser = rows[0];
    enterApp();
  } catch (e) {
    const msg = String(e.message || '');
    if (msg.includes('NEEDS_PASSWORD')) {
      pwWrap.style.display = 'block';
      document.getElementById('mat-khau-input').focus();
      errEl.textContent = mk ? 'Sai mật khẩu. Vui lòng thử lại.' : 'Tài khoản này yêu cầu mật khẩu. Vui lòng nhập mật khẩu.';
      errEl.style.display = 'block';
    } else if (msg.includes('ACCOUNT_DISABLED')) {
      errEl.textContent = 'Tài khoản này đã bị ngừng hoạt động. Vui lòng liên hệ quản trị viên.';
      errEl.style.display = 'block';
    } else if (msg.includes('NOT_FOUND')) {
      errEl.textContent = 'Không tìm thấy mã số nhân viên này. Vui lòng liên hệ quản trị viên để được cấp mã.';
      errEl.style.display = 'block';
    } else {
      errEl.textContent = 'Không kết nối được hệ thống. Chi tiết lỗi: ' + msg.slice(0, 300);
      errEl.style.display = 'block';
    }
  }
}

document.getElementById('ma-so-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});
document.getElementById('mat-khau-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleLogin();
});

function handleLogout() {
  currentUser = null;
  currentSection = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('ma-so-input').value = '';
  document.getElementById('mat-khau-input').value = '';
  document.getElementById('pw-login-wrap').style.display = 'none';
}

function enterApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('sb-name').textContent = currentUser.ho_ten;
  document.getElementById('sb-role').textContent = currentUser.vai_tro === 'admin' ? 'Quản trị viên' : 'Học viên';
  const nav = currentUser.vai_tro === 'admin' ? ADMIN_NAV : HOCVIEN_NAV;
  renderNav(nav);
  goToSection(nav[0].key, nav);
}

function renderNav(nav) {
  const el = document.getElementById('nav-list');
  el.innerHTML = '';
  nav.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (item.disabled ? ' disabled' : '');
    btn.textContent = item.label;
    btn.onclick = () => { if (!item.disabled) goToSection(item.key, nav); };
    btn.dataset.key = item.key;
    el.appendChild(btn);
  });
}

function goToSection(key, nav) {
  currentSection = key;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  const item = nav.find(n => n.key === key);
  const main = document.getElementById('main-content');
  if (key === 'users') return renderUsersSection(main);
  if (key === 'courses') return renderCoursesSection(main);
  if (key === 'certs') return renderCertsAdminSection(main);
  if (key === 'overview') return renderOverviewSection(main);
  if (key === 'my-certs') return renderMyCertsSection(main);
  if (key === 'my-courses') return renderMyCoursesSection(main);
  if (key === 'my-profile') return renderProfileSection(main);
  main.innerHTML = `
    <h2>${item.label}</h2>
    <p class="desc">Phân hệ này chưa hoạt động.</p>
    <div class="panel empty-panel">
      <div class="glyph">···</div>
      <p>Phân hệ "${item.label}" đang được xây dựng, sẽ có trong bước tiếp theo.</p>
    </div>`;
}

async function saveOwnProfile() {

    ho_ten: hoten,
    phong_khoa: document.getElementById('p-phongkhoa').value.trim() || null,
    chuc_vu: document.getElementById('p-chucvu').value.trim() || null,
    so_dien_thoai: document.getElementById('p-sdt').value.trim() || null
  };
  try {
    await sb(`dt_user_profiles?id=eq.${currentUser.id}`, { method: 'PATCH', body: JSON.stringify(payload), prefer: 'return=minimal' });
    currentUser = { ...currentUser, ...payload };
    document.getElementById('sb-name').textContent = currentUser.ho_ten;
    errEl.style.display = 'none';
    const btn = document.querySelector('.btn-save');
    if (btn) { const old = btn.textContent; btn.textContent = 'Đã lưu ✓'; setTimeout(() => { if (btn) btn.textContent = old; }, 1500); }
  } catch (e) {
    errEl.textContent = 'Có lỗi xảy ra: ' + e.message;
    errEl.style.display = 'block';
  }
}

  main.innerHTML = `

      <button class="btn-add" onclick="toggleCourseForm()">Thêm khoá học</button>

function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

async function loadCourses() {
  const tbody = document.getElementById('courses-tbody');
  try {
    const [rows, enrollRows] = await Promise.all([
      sb('dt_courses?select=*&order=ngay_bat_dau.desc'),
      sb('dt_course_enrollments?select=course_id')
    ]);
    const countByCourse = {};
    enrollRows.forEach(e => { countByCourse[e.course_id] = (countByCourse[e.course_id] || 0) + 1; });
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="color:var(--muted)">Chưa có khoá học nào. Bấm "Thêm khoá học" để bắt đầu.</td></tr>`;
      return;
    }
    tbody.innerHTML = rows.map(c => `
      <tr>
        <td>${c.ten_khoa}</td>
        <td>${c.giang_vien || '—'}</td>
        <td>${c.so_gio != null ? c.so_gio : '—'}</td>
        <td>${fmtDate(c.ngay_bat_dau)} – ${fmtDate(c.ngay_ket_thuc)}</td>
        <td style="text-align:center;">${countByCourse[c.id] || 0}</td>
        <td><span class="status-tag ${c.trang_thai}">${TRANG_THAI_LABEL[c.trang_thai]}</span></td>
        <td class="row-actions">
          <button onclick='openCourseDetail(${JSON.stringify(c)})'>Chi tiết</button>
          <button onclick='editCourse(${JSON.stringify(c)})'>Sửa</button>
          <button class="del" onclick="deleteCourse('${c.id}','${c.ten_khoa.replace(/'/g,"\\'")}')">Xoá</button>
        </td>
      </tr>`).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" style="color:var(--danger)">Không tải được danh sách. ${e.message}</td></tr>`;
  }
}

function buoiHocToArray(buoiHoc, count) {
  const arr = [];
  for (let i = 1; i <= count; i++) {
    const found = (buoiHoc || []).find(x => x.buoi === i);
    arr.push(found && found.link ? found.link : '');
  }
  return arr;
}

function buoiLinksHTML(count, links) {
  let html = '';
  for (let i = 1; i <= count; i++) {
    const val = (links[i - 1] || '').replace(/"/g, '&quot;');
    html += `<div><label>Link điểm danh buổi ${i}</label><input id="c-buoi-link-${i}" value="${val}" placeholder="https://..."></div>`;
  }
  return html;
}

function onSoBuoiChange() {
  const count = Math.max(1, parseInt(document.getElementById('c-sobuoi').value) || 1);
  const container = document.getElementById('c-buoi-links-container');
  const existing = [];
  container.querySelectorAll('input').forEach((inp, idx) => existing[idx] = inp.value);
  container.innerHTML = buoiLinksHTML(count, existing);
}

let courseUserMap = {};

async function toggleCourseForm(course) {
  const holder = document.getElementById('course-form-holder');
  if (holder.innerHTML && !course) { holder.innerHTML = ''; editingCourseId = null; return; }
  editingCourseId = course ? course.id : null;
  const initCount = course && course.so_buoi_hoc ? course.so_buoi_hoc : 1;
  const initLinks = buoiHocToArray(course ? course.buoi_hoc : [], initCount);
  const users = await sb(`dt_user_profiles?select=id,ma_so_nhan_vien,ho_ten&order=ho_ten.asc`);
  courseUserMap = {};
  users.forEach(u => courseUserMap[u.ma_so_nhan_vien] = u);
  const currentGiangVienVal = course && course.giang_vien_id
    ? (() => { const u = users.find(x => x.id === course.giang_vien_id); return u ? `${u.ma_so_nhan_vien} — ${u.ho_ten}` : (course.giang_vien || ''); })()
    : (course && course.giang_vien ? course.giang_vien : '');
  holder.innerHTML = `
    <div class="form-grid">
      <p class="form-err" id="course-form-err"></p>
      <div class="full"><label>Tên khoá học *</label><input id="c-ten" value="${course ? course.ten_khoa : ''}"></div>
      <div class="full"><label>Mô tả</label><input id="c-mota" value="${course && course.mo_ta ? course.mo_ta : ''}"></div>
      <div><label>Địa điểm</label><input id="c-diadiem" value="${course && course.dia_diem ? course.dia_diem : ''}" placeholder="VD: Hội trường tầng 3"></div>
      <div class="full"><label>Giảng viên phụ trách (gõ mã số/tên nếu là người dùng có sẵn, hoặc để tên tự do)</label>
        <input id="c-giangvien" list="c-giangvien-datalist" value="${currentGiangVienVal.replace(/"/g, '&quot;')}">
        <datalist id="c-giangvien-datalist">${users.map(u => `<option value="${u.ma_so_nhan_vien} — ${u.ho_ten}">`).join('')}</datalist>
      </div>
      <div><label>Số giờ đào tạo</label><input id="c-sogio" type="number" step="0.5" value="${course && course.so_gio != null ? course.so_gio : ''}"></div>
      <div><label>Ngày bắt đầu</label><input id="c-batdau" type="date" value="${course && course.ngay_bat_dau ? course.ngay_bat_dau : ''}"></div>
      <div><label>Ngày kết thúc</label><input id="c-ketthuc" type="date" value="${course && course.ngay_ket_thuc ? course.ngay_ket_thuc : ''}"></div>
      <div><label>Số buổi học</label><input id="c-sobuoi" type="number" min="1" value="${initCount}" oninput="onSoBuoiChange()"></div>
      <div class="full">
        <label>Link điểm danh từng buổi</label>
        <div id="c-buoi-links-container" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">${buoiLinksHTML(initCount, initLinks)}</div>
      </div>
      <div class="full"><label>Điều kiện cấp CME</label><input id="c-dieukiencme" value="${course && course.dieu_kien_cme ? course.dieu_kien_cme : ''}" placeholder="VD: Tham dự tối thiểu 80% số buổi, làm bài đánh giá cuối khoá"></div>
      <div><label>Trạng thái</label>
        <select id="c-trangthai">
          <option value="sap_dien_ra" ${course && course.trang_thai === 'sap_dien_ra' ? 'selected' : ''}>Sắp diễn ra</option>
          <option value="dang_dien_ra" ${course && course.trang_thai === 'dang_dien_ra' ? 'selected' : ''}>Đang diễn ra</option>
          <option value="da_xong" ${course && course.trang_thai === 'da_xong' ? 'selected' : ''}>Đã xong</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn-save" onclick="saveCourse()">Lưu</button>
        <button class="btn-cancel" onclick="toggleCourseForm()">Huỷ</button>
      </div>
    </div>`;
}

function editCourse(course) { toggleCourseForm(course); }

async function saveCourse() {
  const errEl = document.getElementById('course-form-err');
  errEl.style.display = 'none';
  const ten = document.getElementById('c-ten').value.trim();
  if (!ten) {
    errEl.textContent = 'Vui lòng nhập tên khoá học.';
    errEl.style.display = 'block';
    return;
  }
  const soBuoi = Math.max(1, parseInt(document.getElementById('c-sobuoi').value) || 1);
  const buoiHoc = [];
  for (let i = 1; i <= soBuoi; i++) {
    const linkInput = document.getElementById(`c-buoi-link-${i}`);
    const linkVal = linkInput ? linkInput.value.trim() : '';
    buoiHoc.push({ buoi: i, link: linkVal || null });
  }
  const giangVienVal = document.getElementById('c-giangvien').value.trim();
  const gvMaso = giangVienVal.split('—')[0].trim().toUpperCase();
  const matchedGv = courseUserMap[gvMaso];
  const payload = {
    ten_khoa: ten,
    mo_ta: document.getElementById('c-mota').value.trim() || null,
    dia_diem: document.getElementById('c-diadiem').value.trim() || null,
    dieu_kien_cme: document.getElementById('c-dieukiencme').value.trim() || null,
    giang_vien: matchedGv ? matchedGv.ho_ten : (giangVienVal || null),
    giang_vien_id: matchedGv ? matchedGv.id : null,
    so_gio: document.getElementById('c-sogio').value ? Number(document.getElementById('c-sogio').value) : null,
    ngay_bat_dau: document.getElementById('c-batdau').value || null,
    ngay_ket_thuc: document.getElementById('c-ketthuc').value || null,
    so_buoi_hoc: soBuoi,
    buoi_hoc: buoiHoc,
    trang_thai: document.getElementById('c-trangthai').value
  };
  try {
    if (editingCourseId) {
      await sb(`dt_courses?id=eq.${editingCourseId}`, { method: 'PATCH', body: JSON.stringify(payload) });
    } else {
      await sb('dt_courses', { method: 'POST', body: JSON.stringify(payload) });
    }
    editingCourseId = null;
    await renderCoursesSection(document.getElementById('main-content'));
  } catch (e) {
    errEl.textContent = 'Có lỗi xảy ra: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function deleteCourse(id, name) {
  if (!confirm(`Xoá khoá học "${name}"? Hành động này không thể hoàn tác.`)) return;
  try {
    await sb(`dt_courses?id=eq.${id}`, { method: 'DELETE' });
    await loadCourses();
  } catch (e) {
    alert('Không xoá được: ' + e.message);
  }
}

      <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;">

          <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=${encodeURIComponent(ex.link_bai)}" width="70" height="70" style="border:1px solid var(--line);border-radius:3px;" alt="QR">

async function addExam(courseId) {
  const errEl = document.getElementById('exam-err');
  errEl.style.display = 'none';
  const ten = document.getElementById('exam-ten').value.trim();
  const link = document.getElementById('exam-link').value.trim();
  if (!ten || !link) { errEl.textContent = 'Vui lòng nhập tên bài và link bài thi.'; errEl.style.display = 'block'; return; }

async function uploadMaterial(courseId) {
  const errEl = document.getElementById('mat-err');
  errEl.style.display = 'none';
  const ten = document.getElementById('mat-ten').value.trim();
  const fileInput = document.getElementById('mat-file');
  const file = fileInput.files[0];
  if (!ten || !file) { errEl.textContent = 'Vui lòng nhập tên tài liệu và chọn file.'; errEl.style.display = 'block'; return; }
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
    const path = `${courseId}/${Date.now()}_${safeName}`;
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/dt-tai-lieu/${path}`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type || 'application/octet-stream' },
      body: file
    });
    if (!uploadRes.ok) throw new Error(await uploadRes.text());
    const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/dt-tai-lieu/${path}`;
    await sb('dt_course_materials', { method: 'POST', body: JSON.stringify({ course_id: courseId, ten_tai_lieu: ten, file_url: fileUrl, file_path: path }) });
    document.getElementById('mat-ten').value = '';
    fileInput.value = '';
    await loadMaterials(courseId);
  } catch (e) {
    errEl.textContent = 'Tải lên thất bại: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function addRosterCodes(courseId, codes) {

  } catch (e) { /* tiếp tục thêm dù không tra được tên */ }
  const rows = codes.map(c => ({ course_id: courseId, ma_so_nhan_vien: c, ho_ten: nameMap[c] || null }));

    await sb('dt_course_roster?on_conflict=course_id,ma_so_nhan_vien', {
      method: 'POST',
      body: JSON.stringify(chunk),
      prefer: 'resolution=merge-duplicates,return=minimal'

  }

  errEl.style.display = 'none';
  try {
    const rawRows = await readExcelFile(file);
    const codes = [];
    rawRows.forEach(row => {
      for (const key in row) {
        const nk = normKey(key);
        if (nk.includes('ma so') || nk.includes('ma nv') || nk === 'ma') {
          const v = String(row[key]).trim().toUpperCase();

      errEl.textContent = 'Không tìm thấy cột "Mã số nhân viên" hợp lệ trong file.';
      errEl.style.display = 'block';

    alert(`Đã thêm ${uniqueCodes.length} mã số nhân viên vào danh sách.`);

    errEl.textContent = 'Nhập thất bại: ' + e.message;
    errEl.style.display = 'block';

const USER_COL_ALIASES = {
  'ma so nhan vien': 'ma_so_nhan_vien', 'ma nhan vien': 'ma_so_nhan_vien', 'ma so': 'ma_so_nhan_vien', 'ma nv': 'ma_so_nhan_vien',
  'ho ten': 'ho_ten', 'ho va ten': 'ho_ten', 'ten': 'ho_ten',
  'phong/khoa': 'phong_khoa', 'phong khoa': 'phong_khoa', 'khoa': 'phong_khoa', 'phong': 'phong_khoa',
  'chuc vu': 'chuc_vu',
  'so dien thoai': 'so_dien_thoai', 'dien thoai': 'so_dien_thoai', 'sdt': 'so_dien_thoai',
  'vai tro': 'vai_tro', 'quyen': 'vai_tro',
  'ngay cap cchn': 'ngay_cap_cchn', 'ngay cchn': 'ngay_cap_cchn', 'cchn': 'ngay_cap_cchn'
};

function mapRowToUser(row) {
  const out = {};
  for (const key in row) {
    const field = USER_COL_ALIASES[normKey(key)];
    if (field) out[field] = String(row[key]).trim();
  }
  return out;
}

async function handleUserExcelImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  try {
    const rawRows = await readExcelFile(file);
    const mapped = rawRows.map(mapRowToUser);
    const parsed = [];
    let skipped = 0;
    mapped.forEach(m => {
      if (!m.ma_so_nhan_vien || !m.ho_ten) { skipped++; return; }
      parsed.push({
        ma_so_nhan_vien: m.ma_so_nhan_vien.toUpperCase(),
        ho_ten: m.ho_ten,
        phong_khoa: m.phong_khoa || '',
        chuc_vu: m.chuc_vu || '',
        so_dien_thoai: m.so_dien_thoai || '',
        vai_tro_raw: m.vai_tro || '',
        ngay_cap_cchn_raw: m.ngay_cap_cchn || ''
      });
    });
    if (!parsed.length) {
      alert('Không tìm thấy dòng hợp lệ nào trong file. Kiểm tra lại tên cột có đúng như file mẫu không (Mã số nhân viên, Họ tên...).');
      return;
    }

    // Lấy dữ liệu hiện có để KHÔNG ghi đè mất các ô chị để trống trong file
    const masoList = parsed.map(p => p.ma_so_nhan_vien);
    const existingByMaso = {};
    for (const chunk of chunkArray(masoList, 200)) {
      const rows = await sb(`dt_user_profiles?ma_so_nhan_vien=in.(${chunk.map(c => `"${c}"`).join(',')})&select=${USER_COLS}`);
      rows.forEach(u => existingByMaso[u.ma_so_nhan_vien] = u);
    }

    const valid = parsed.map(p => {
      const existing = existingByMaso[p.ma_so_nhan_vien];
      const vaiTroNorm = normKey(p.vai_tro_raw);
      const vaiTroFromFile = vaiTroNorm ? ((vaiTroNorm.includes('admin') || vaiTroNorm.includes('quan tri')) ? 'admin' : 'hoc_vien') : null;
      const cchnParsed = p.ngay_cap_cchn_raw ? parseFlexibleDate(p.ngay_cap_cchn_raw) : null;
      return {
        ma_so_nhan_vien: p.ma_so_nhan_vien,
        ho_ten: p.ho_ten,
        phong_khoa: p.phong_khoa || (existing ? existing.phong_khoa : null),
        chuc_vu: p.chuc_vu || (existing ? existing.chuc_vu : null),
        so_dien_thoai: p.so_dien_thoai || (existing ? existing.so_dien_thoai : null),
        vai_tro: vaiTroFromFile || (existing ? existing.vai_tro : 'hoc_vien'),
        ngay_cap_cchn: cchnParsed || (existing ? existing.ngay_cap_cchn : null)
      };
    });

    for (const chunk of chunkArray(valid, 200)) {
      await sb('dt_user_profiles?on_conflict=ma_so_nhan_vien', {
        method: 'POST',
        body: JSON.stringify(chunk),
        prefer: 'resolution=merge-duplicates,return=minimal'
      });
    }

    const relinked = await relinkExternalCerts(valid);

    alert(`Đã nhập ${valid.length} người dùng${skipped ? ` (bỏ qua ${skipped} dòng thiếu Mã số/Họ tên)` : ''}. Các ô để trống trong file sẽ giữ nguyên dữ liệu cũ nếu người đó đã có sẵn trong hệ thống.${relinked ? ` Đã tự gắn lại ${relinked} chứng chỉ trước đó "chưa có tài khoản" vào đúng tài khoản mới.` : ''}`);
    await renderUsersSection(document.getElementById('main-content'));
  } catch (e) {
    alert('Nhập thất bại: ' + e.message);
  }
}

async function relinkExternalCerts(rowsWithMaso) {
  const masoList = rowsWithMaso.map(r => r.ma_so_nhan_vien);
  const [idsRes, externalCerts] = await Promise.all([
    sb(`dt_user_profiles?ma_so_nhan_vien=in.(${masoList.map(c => `"${c}"`).join(',')})&select=id,ma_so_nhan_vien,ho_ten`),
    sb(`dt_certificates?user_id=is.null&external_key=not.is.null&select=id,external_key`)
  ]);
  const extByKey = {};
  (externalCerts || []).forEach(c => { (extByKey[c.external_key] = extByKey[c.external_key] || []).push(c.id); });
  let relinkedCount = 0;
  for (const u of idsRes) {
    const key = normKey(u.ho_ten);
    const ids = extByKey[key];
    if (ids && ids.length) {
      await sb(`dt_certificates?id=in.(${ids.map(id => `"${id}"`).join(',')})`, {
        method: 'PATCH',
        body: JSON.stringify({ user_id: u.id, external_name: null, external_key: null }),
        prefer: 'return=minimal'
      });
      relinkedCount += ids.length;
    }
  }
  return relinkedCount;
}

function certExpiryBadge(ngayHetHan) {
  if (!ngayHetHan) return '';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const exp = new Date(ngayHetHan);
  const diffDays = Math.round((exp - today) / 86400000);
  if (diffDays < 0) return `<span class="exp-badge expired">Đã hết hạn</span>`;
  if (diffDays <= 30) return `<span class="exp-badge soon">Sắp hết hạn</span>`;
  return '';
}

async function uploadCertFile(file, userId) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
  const path = `${userId}/${Date.now()}_${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/dt-chung-chi/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type || 'application/octet-stream' },
    body: file
  });
  if (!res.ok) throw new Error(await res.text());
  return { file_url: `${SUPABASE_URL}/storage/v1/object/public/dt-chung-chi/${path}`, file_path: path };
}

// ---------- Import hàng loạt CME từ file Excel theo dõi ----------
function excelSerialToDateStr(serial) {
  const utcDays = Math.floor(serial - 25569);
  const d = new Date(utcDays * 86400 * 1000);
  return isNaN(d) ? null : d.toISOString().slice(0, 10);
}

function parseFlexibleDate(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (raw instanceof Date) return isNaN(raw) ? null : raw.toISOString().slice(0, 10);
  if (typeof raw === 'number') {
    if (raw < 1000 || raw > 60000) return null;
    return excelSerialToDateStr(raw);
  }
  const str = String(raw).trim();
  const m = str.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (!m) return null;
  const a = parseInt(m[1]), b = parseInt(m[2]), y = parseInt(m[3]);
  let day, month;
  if (a > 12) { day = a; month = b; }
  else if (b > 12) { day = b; month = a; }
  else { day = a; month = b; }
  if (month < 1 || month > 12 || day < 1 || day > 31) return null;
  const d = new Date(Date.UTC(y, month - 1, day));
  if (isNaN(d) || d.getUTCMonth() !== month - 1) return null;
  return d.toISOString().slice(0, 10);
}

function determineLoaiFromRow(row) {
  const c6 = row[6], c7 = row[7], c8 = row[8];
  if (c6 && String(c6).trim().toLowerCase() === 'x') return 'cme';
  if (c7 && String(c7).trim().toLowerCase() === 'x') return 'cpe';
  if (c8 && String(c8).trim().toLowerCase() === 'x') return 'cne';
  return 'cme';
}

function parseCmeTrackingFile(rawRows) {
  let headerIdx = -1;
  for (let i = 0; i < rawRows.length; i++) {
    const cell = rawRows[i] && rawRows[i][0];
    if (cell && String(cell).trim() === 'STT') { headerIdx = i; break; }
  }
  if (headerIdx === -1) throw new Error('Không tìm thấy dòng tiêu đề (cột "STT"). Kiểm tra lại file có đúng mẫu Bảng theo dõi CME không.');

  const peopleMap = {};
  let curKey = null;
  let totalCertRows = 0;
  let unparsedDateCount = 0;

  for (let i = headerIdx + 1; i < rawRows.length; i++) {
    const row = rawRows[i] || [];
    const hoTenCell = row[1] ? String(row[1]).trim() : '';
    const tenKhoaCell = row[5] ? String(row[5]).trim() : '';
    if (hoTenCell) {
      curKey = normKey(hoTenCell);
      if (!peopleMap[curKey]) {
        peopleMap[curKey] = {
          hoTen: hoTenCell,
          soCCHN: row[2] ? String(row[2]).trim() : '',
          phamVi: row[3] ? String(row[3]).trim() : '',
          viTri: row[4] ? String(row[4]).trim() : '',
          certs: []
        };
      }
    }
    if (!curKey) continue;
    if (tenKhoaCell) {
      totalCertRows++;
      const ngayCap = parseFlexibleDate(row[10]);
      if (!ngayCap) unparsedDateCount++;
      const soTietRaw = row[9];
      const soTiet = (soTietRaw !== null && soTietRaw !== '' && !isNaN(Number(soTietRaw))) ? Number(soTietRaw) : null;
      peopleMap[curKey].certs.push({ ten: tenKhoaCell, loai: determineLoaiFromRow(row), soTiet, ngayCap });
    }
  }
  return { people: Object.values(peopleMap), totalCertRows, unparsedDateCount };
}

async function handleCmeBulkImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  try {
    const rawRows = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          resolve(XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true }));
        } catch (err) { reject(err); }
      };
      reader.onerror = () => reject(new Error('Không đọc được file.'));
      reader.readAsArrayBuffer(file);
    });

    const { people, totalCertRows, unparsedDateCount } = parseCmeTrackingFile(rawRows);
    if (!people.length) { alert('Không tìm thấy dữ liệu người nào trong file.'); return; }

    const existingUsers = await sb(`dt_user_profiles?select=id,ho_ten,chuc_vu`);
    const userByName = {};
    existingUsers.forEach(u => { userByName[normKey(u.ho_ten)] = u; });

    let matchedCount = 0, externalCount = 0;
    const certInsertRows = [];
    const profileUpdates = [];

    people.forEach(p => {
      const key = normKey(p.hoTen);
      const matched = userByName[key];
      if (matched) {
        matchedCount++;
        if (!matched.chuc_vu && p.viTri) profileUpdates.push({ id: matched.id, chuc_vu: p.viTri });
      } else {
        externalCount++;
      }
      p.certs.forEach(c => {
        certInsertRows.push({
          user_id: matched ? matched.id : null,
          external_name: matched ? null : p.hoTen,
          external_key: matched ? null : key,
          ten_chung_chi: c.ten,
          loai_chung_chi: c.loai,
          so_gio_tin_chi: c.soTiet,
          ngay_cap: c.ngayCap,
          nguon: 'admin',
          trang_thai_duyet: 'da_duyet'
        });
      });
      if (p.certs.length === 0 && !matched) {
        certInsertRows.push({
          user_id: null,
          external_name: p.hoTen,
          external_key: key,
          ten_chung_chi: '(Chưa có chứng chỉ ghi nhận trong file)',
          loai_chung_chi: 'cme',
          so_gio_tin_chi: 0,
          ngay_cap: null,
          nguon: 'admin',
          trang_thai_duyet: 'da_duyet'
        });
      }
    });

    const confirmMsg = `Tìm thấy ${people.length} người (${matchedCount} đã có tài khoản trong hệ thống, ${externalCount} chưa có tài khoản — vẫn đưa vào thống kê, hiển thị bằng tên).\n` +
      `Tổng ${totalCertRows} dòng chứng chỉ sẽ được nhập${unparsedDateCount ? `, trong đó ${unparsedDateCount} dòng không đọc được ngày cấp (vẫn nhập, chỉ để trống ngày)` : ''}.\n\nTiếp tục nhập?`;
    if (!confirm(confirmMsg)) return;

    for (const chunk of chunkArray(certInsertRows, 200)) {
      await sb('dt_certificates', { method: 'POST', body: JSON.stringify(chunk), prefer: 'return=minimal' });
    }
    for (const upd of profileUpdates) {
      await sb(`dt_user_profiles?id=eq.${upd.id}`, { method: 'PATCH', body: JSON.stringify({ chuc_vu: upd.chuc_vu }), prefer: 'return=minimal' });
    }

    alert(`Đã nhập xong: ${certInsertRows.length} dòng chứng chỉ cho ${people.length} người.`);
    await loadCerts();
  } catch (e) {
    alert('Nhập thất bại: ' + e.message);
  }
}

function onCertFilterLoai(v) { certFilterLoai = v; renderCertRows(); }
let certFilterMissingDate = false;
function onCertFilterMissingDate(v) { certFilterMissingDate = v; renderCertRows(); }

function renderCertRows() {
  const tbody = document.getElementById('certs-tbody');
  const q = normKey(certSearchTerm || '');
  let rows = allCertsCache;
  if (certFilterStatus !== 'all') rows = rows.filter(c => c.trang_thai_duyet === certFilterStatus);
  if (certFilterLoai !== 'all') rows = rows.filter(c => c.loai_chung_chi === certFilterLoai);
  if (certFilterMissingDate) rows = rows.filter(c => !c.ngay_cap);
  if (q) {
    rows = rows.filter(c =>
      normKey(c.ten_chung_chi || '').includes(q) ||
      normKey((c.hoso && c.hoso.ho_ten) || '').includes(q) ||
      normKey((c.hoso && c.hoso.ma_so_nhan_vien) || '').includes(q)
    );
  }
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="11" style="color:var(--muted)">Không có chứng chỉ nào.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(certRowHTML).join('');

async function saveAdminCert() {
  const errEl = document.getElementById('add-cert-err');
  errEl.style.display = 'none';
  const userInputVal = document.getElementById('cert-user-input').value.trim();
  const maso = userInputVal.split('—')[0].trim().toUpperCase();
  const user = certUserMap[maso];
  const ten = document.getElementById('cert-ten').value.trim();
  if (!user) {
    errEl.textContent = 'Không tìm thấy học viên với mã số này. Chọn từ danh sách gợi ý nhé.';
    errEl.style.display = 'block';
    return;
  }
  if (!ten) {
    errEl.textContent = 'Vui lòng nhập tên chứng chỉ.';
    errEl.style.display = 'block';
    return;
  }
  const loaiChon = document.getElementById('cert-loai').value;
  const ngayCap = document.getElementById('cert-ngaycap').value || null;

  // Kiểm tra trùng lặp (mềm) trước khi lưu
  const dup = allCertsCache.find(c => c.user_id === user.id && normKey(c.ten_chung_chi) === normKey(ten) && c.ngay_cap === ngayCap);
  if (dup && !confirm(`Học viên "${user.ho_ten}" có vẻ đã có chứng chỉ "${ten}"${ngayCap ? ' cấp ngày ' + fmtDate(ngayCap) : ''} trong hệ thống rồi. Vẫn muốn thêm bản mới?`)) {
    return;
  }

  try {
    const file = document.getElementById('cert-file').files[0];
    let fileInfo = {};
    if (file) fileInfo = await uploadCertFile(file, user.id);
    const payload = {
      user_id: user.id,
      course_id: document.getElementById('cert-khoa').value || null,
      ten_chung_chi: ten,
      loai_chung_chi: loaiChon,
      don_vi_cap: document.getElementById('cert-donvi').value.trim() || null,
      so_gio_tin_chi: document.getElementById('cert-sogio').value ? Number(document.getElementById('cert-sogio').value) : null,
      ngay_cap: ngayCap,
      ngay_het_han: document.getElementById('cert-hethan').value || null,
      nguon: 'admin',
      trang_thai_duyet: 'da_duyet',
      ...fileInfo
    };
    await sb('dt_certificates', { method: 'POST', body: JSON.stringify(payload), prefer: 'return=minimal' });
    toggleAddCertForm();
    await loadCerts();
  } catch (e) {
    errEl.textContent = 'Có lỗi xảy ra: ' + e.message;
    errEl.style.display = 'block';
  }
}

let cmeCycle120 = { start: '2021-01-01', end: '2025-12-31', required_hours: 120 };
let cmeCycle48 = { start: '2024-01-01', end: '2025-12-31', required_hours: 48 };

    });
  } catch (e) { /* dùng mặc định nếu chưa có */ }

async function saveCycleSetting(key, start, end, hours) {

  await sb(`dt_settings?key=eq.${key}`, { method: 'PATCH', body: JSON.stringify({ value }), prefer: 'return=minimal' });

}

function computeCycleStats(users, certs, cycle) {
  const start = cycle.start, end = cycle.end, required = Number(cycle.required_hours) || 0;
  const hoursByUser = {};
  const externalMeta = {};
  certs.forEach(c => {
    if (c.trang_thai_duyet !== 'da_duyet') return;
    const h = Number(c.so_gio_tin_chi) || 0;
    const inRange = c.ngay_cap && c.ngay_cap >= start && c.ngay_cap <= end;
    if (c.user_id) {
      if (inRange) hoursByUser[c.user_id] = (hoursByUser[c.user_id] || 0) + h;
    } else if (c.external_key) {
      if (!externalMeta[c.external_key]) externalMeta[c.external_key] = { name: c.external_name || c.external_key, dept: c.external_phong_khoa || '', hours: 0 };
      if (!externalMeta[c.external_key].dept && c.external_phong_khoa) externalMeta[c.external_key].dept = c.external_phong_khoa;
      if (inRange) externalMeta[c.external_key].hours += h;
    }
  });
  const people = users.map(u => {
    const dat = hoursByUser[u.id] || 0;
    return { name: u.ho_ten, dept: u.phong_khoa || 'Chưa phân khoa', chuc_vu: u.chuc_vu, dat, thieu: Math.max(0, required - dat), du: dat >= required };
  });
  Object.values(externalMeta).forEach(e => {
    people.push({ name: e.name + ' (chưa có tài khoản)', dept: e.dept || 'Chưa có tài khoản (dữ liệu ngoài)', chuc_vu: '', dat: e.hours, thieu: Math.max(0, required - e.hours), du: e.hours >= required });
  });
  const tongNV = people.length;
  const soDu = people.filter(p => p.du).length;
  const soThieu = tongNV - soDu;
  const tyLeDu = tongNV ? Math.round((soDu / tongNV) * 100) : 0;
  const tongGioThieu = people.reduce((s, p) => s + p.thieu, 0);
  const byDept = {};
  people.forEach(p => {
    if (!byDept[p.dept]) byDept[p.dept] = { total: 0, du: 0 };
    byDept[p.dept].total++;
    if (p.du) byDept[p.dept].du++;
  });
  const deptRows = Object.entries(byDept).sort((a, b) => b[1].total - a[1].total);
  const topThieu = [...people].filter(p => p.thieu > 0).sort((a, b) => b.thieu - a.thieu).slice(0, 10);
  return { required, start, end, tongNV, soDu, soThieu, tyLeDu, tongGioThieu, deptRows, topThieu, people };
}

// ---------- Tra cứu cá nhân (debug số liệu) ----------
let dashboardUsersCache = [];
let dashboardCertsCache = [];
let dashboardCycleStats = {};

function onLookupInput(v) {
  const term = normKey(v || '');
  const resultEl = document.getElementById('lookup-result');
  if (!term || term.length < 2) { resultEl.innerHTML = ''; return; }
  const matchedUsers = dashboardUsersCache.filter(u => normKey(u.ho_ten).includes(term));
  const seenKeys = new Set();
  const matchedExternal = [];
  dashboardCertsCache.forEach(c => {
    if (!c.user_id && c.external_name && normKey(c.external_name).includes(term) && !seenKeys.has(c.external_key)) {
      seenKeys.add(c.external_key);
      matchedExternal.push(c);
    }
  });
  let html = matchedUsers.map(u => renderLookupCard(u.ho_ten, u.id, null, u.phong_khoa)).join('');
  html += matchedExternal.map(c => renderLookupCard(c.external_name, null, c.external_key, c.external_phong_khoa)).join('');
  resultEl.innerHTML = html || `<div style="padding:12px 4px;color:var(--muted)">Không tìm thấy ai khớp tên này.</div>`;
}

function renderLookupCard(name, userId, externalKey, dept) {
  const myCerts = dashboardCertsCache.filter(c => userId ? c.user_id === userId : c.external_key === externalKey);
  const sumInCycle = (cy) => myCerts.filter(c => c.trang_thai_duyet === 'da_duyet' && c.ngay_cap && c.ngay_cap >= cy.start && c.ngay_cap <= cy.end).reduce((s, c) => s + (Number(c.so_gio_tin_chi) || 0), 0);
  const sum120 = sumInCycle(cmeCycle120), sum48 = sumInCycle(cmeCycle48);
  return `
    <div class="panel" style="margin-bottom:12px;">
      <div style="padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;">
        <strong>${name}</strong><span style="color:var(--muted);font-size:12.5px;">${dept || (userId ? '' : 'chưa có tài khoản')}</span>
      </div>
      <div style="padding:10px 20px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);">
        Chu kỳ 5 năm: <strong style="color:var(--ink)">${sum120}</strong> giờ &nbsp;·&nbsp; Chu kỳ 2 năm: <strong style="color:var(--ink)">${sum48}</strong> giờ &nbsp;·&nbsp; ${myCerts.length} dòng chứng chỉ
      </div>
      <table>
        <thead><tr><th>Tên chứng chỉ</th><th>Ngày cấp</th><th>Số giờ</th><th>Trạng thái tính</th></tr></thead>

// ---------- Xuất báo cáo CME dạng Excel ----------
function diffYearsFromToday(dateStr) {
  const d = new Date(dateStr);
  const today = new Date();
  return (today - d) / (365.25 * 86400 * 1000);
}

async function exportCmeReport() {
  try {
    const [users, certs, cycleRows] = await Promise.all([
      sb(`dt_user_profiles?select=id,ma_so_nhan_vien,ho_ten,chuc_vu,ngay_cap_cchn,trang_thai,theo_doi_cme&trang_thai=eq.hoat_dong`),
      sb(`dt_certificates?select=user_id,so_gio_tin_chi,ngay_cap,loai_chung_chi,trang_thai_duyet`),
      sb(`dt_settings?key=eq.cme_cycle_48&select=value`)
    ]);
    const cycle48 = (cycleRows && cycleRows[0]) ? cycleRows[0].value : { start: '2025-01-01', end: '2026-12-31', required_hours: 48 };
    const tracked = users.filter(u => u.theo_doi_cme !== false);
    const todayStr = new Date().toISOString().slice(0, 10);

    const rows = tracked.map((u, idx) => {
      const myCerts = certs.filter(c => c.user_id === u.id && c.trang_thai_duyet === 'da_duyet');
      const cchn = u.ngay_cap_cchn;
      const effectiveStart = (cchn && cchn > '2024-01-01') ? cchn : '2024-01-01';
      const yearsElapsed = Math.max(1, 2026 - parseInt(effectiveStart.slice(0, 4)) + 1);
      const target2026 = 24 * yearsElapsed;
      const soTiet = myCerts
        .filter(c => c.ngay_cap && c.ngay_cap >= effectiveStart && c.ngay_cap <= todayStr)
        .reduce((s, c) => s + (Number(c.so_gio_tin_chi) || 0), 0);
      const canBoSung = Math.max(0, target2026 - soTiet);
      const tienDo = Math.round((soTiet / 120) * 1000000) / 1000000;

      const soTiet2Nam = myCerts
        .filter(c => c.ngay_cap && c.ngay_cap >= cycle48.start && c.ngay_cap <= cycle48.end)
        .reduce((s, c) => s + (Number(c.so_gio_tin_chi) || 0), 0);

      const isDuocSi = normKey(u.chuc_vu || '').includes('duoc si');
      let tinhTrang, mau;
      if (isDuocSi) {
        const cpeDates = myCerts.filter(c => c.loai_chung_chi === 'cpe' && c.ngay_cap).map(c => c.ngay_cap).sort().reverse();
        const latestCpe = cpeDates[0];
        const cchnOk = cchn && diffYearsFromToday(cchn) <= 3;
        const cpeOk = latestCpe && diffYearsFromToday(latestCpe) <= 3;
        if (cchnOk || cpeOk) { tinhTrang = 'Hoàn thành'; mau = 'green'; }
        else { tinhTrang = 'Cảnh báo'; mau = 'red'; }
      } else if (soTiet >= 120) {
        tinhTrang = 'Hoàn thành'; mau = 'green';
      } else if (soTiet2Nam >= (Number(cycle48.required_hours) || 48)) {
        tinhTrang = 'Đạt tiến độ'; mau = 'yellow';
      } else {
        tinhTrang = 'Cảnh báo'; mau = 'red';
      }

      return { data: [idx + 1, 'MSG DKTK', u.ma_so_nhan_vien, u.ho_ten, u.chuc_vu || '', '', Math.round(soTiet * 100) / 100, tinhTrang, cchn || '', tienDo, Math.round(canBoSung * 100) / 100], mau };
    });

    const colorArgb = { green: 'FFC6EFCE', yellow: 'FFFFEB9C', red: 'FFFFC7CE' };
    const fontArgb = { green: 'FF006100', yellow: 'FF9C6500', red: 'FF9C0006' };

    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Báo cáo CME');
    ws.columns = [
      { width: 5 }, { width: 10 }, { width: 14 }, { width: 26 }, { width: 26 },
      { width: 12 }, { width: 10 }, { width: 22 }, { width: 14 }, { width: 16 }, { width: 20 }
    ];

    ws.mergeCells('A1:K1');
    const titleCell = ws.getCell('A1');
    titleCell.value = 'TỔNG HỢP THEO DÕI ĐÀO TẠO CHUYÊN MÔN LIÊN TỤC';
    titleCell.font = { bold: true, size: 13 };
    titleCell.alignment = { horizontal: 'center' };

    const headerRow = ws.addRow(['Stt', 'BV/PK', 'Mã NV (HRM)', 'Họ tên nhân viên', 'Chức danh', 'Đối tượng', 'Số tiết', 'Tình trạng cập nhật CME', 'Ngày cấp CCHN', 'Tiến độ so với 5 năm', 'Số tiết cần bổ sung 2026']);
    headerRow.font = { bold: true };
    headerRow.eachCell(c => { c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE1EBE7' } }; });

    rows.forEach(r => {
      const row = ws.addRow(r.data);
      const statusCell = row.getCell(8);
      statusCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: colorArgb[r.mau] } };
      statusCell.font = { color: { argb: fontArgb[r.mau] }, bold: true };
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bao_cao_CME_${todayStr}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Xuất báo cáo thất bại: ' + e.message);
  }
}

  const tbody = document.getElementById('users-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="8" style="color:var(--muted)">Không tìm thấy người dùng nào.</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(userRowHTML).join('');
}

// ---------- Thêm mới (form trên đầu trang) ----------
function toggleAddUserForm() {
  const holder = document.getElementById('add-user-form-holder');
  if (holder.innerHTML) { holder.innerHTML = ''; return; }
  holder.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <div class="form-grid">
        <p class="form-err" id="add-form-err"></p>
        <div><label>Mã số nhân viên *</label><input id="add-maso" placeholder="VD: DKTK0163"></div>
        <div><label>Họ tên *</label><input id="add-hoten"></div>
        <div><label>Phòng/Khoa</label><input id="add-phongkhoa"></div>
        <div><label>Chức vụ</label><input id="add-chucvu"></div>
        <div><label>Số điện thoại</label><input id="add-sdt"></div>
        <div><label>Vai trò</label>
          <select id="add-vaitro"><option value="hoc_vien">Học viên</option><option value="admin">Quản trị viên</option></select>
        </div>
        <div class="full">
          <label style="display:flex;align-items:center;gap:7px;"><input type="checkbox" id="add-theodoi-cme" style="width:auto;" checked> Theo dõi CME (bỏ tick nếu là nhân sự không thuộc khối chuyên môn, VD Ban giám đốc/Nhân sự không hành nghề khám chữa bệnh)</label>
        </div>
        <div class="full">
          <label style="display:flex;align-items:center;gap:7px;"><input type="checkbox" id="add-needpw" style="width:auto;" onchange="document.getElementById('add-pw-wrap').style.display = this.checked ? 'block' : 'none'"> Yêu cầu mật khẩu để đăng nhập</label>
        </div>
        <div class="full" id="add-pw-wrap" style="display:none;">
          <label>Mật khẩu</label><input id="add-password" type="text" placeholder="Nhập mật khẩu">
        </div>
        <div class="form-actions">
          <button class="btn-save" onclick="saveNewUser()">Lưu</button>
          <button class="btn-cancel" onclick="toggleAddUserForm()">Huỷ</button>
        </div>
      </div>
    </div>`;
  document.getElementById('add-maso').focus();
}

async function saveNewUser() {
  const errEl = document.getElementById('add-form-err');
  errEl.style.display = 'none';
  const maso = document.getElementById('add-maso').value.trim().toUpperCase();
  const hoten = document.getElementById('add-hoten').value.trim();
  const needPw = document.getElementById('add-needpw').checked;
  const pwVal = document.getElementById('add-password').value.trim();
  if (!maso || !hoten) {
    errEl.textContent = 'Vui lòng nhập đủ Mã số nhân viên và Họ tên.';
    errEl.style.display = 'block';
    return;
  }
  if (needPw && !pwVal) {
    errEl.textContent = 'Vui lòng nhập mật khẩu cho tài khoản này.';
    errEl.style.display = 'block';
    return;
  }
  const payload = {
    ma_so_nhan_vien: maso,
    ho_ten: hoten,
    phong_khoa: document.getElementById('add-phongkhoa').value.trim() || null,
    chuc_vu: document.getElementById('add-chucvu').value.trim() || null,
    so_dien_thoai: document.getElementById('add-sdt').value.trim() || null,
    vai_tro: document.getElementById('add-vaitro').value,
    theo_doi_cme: document.getElementById('add-theodoi-cme').checked
  };
  try {
    const rows = await sb(`dt_user_profiles?select=${USER_COLS}`, { method: 'POST', body: JSON.stringify(payload) });
    const targetId = rows[0].id;
    if (needPw && pwVal) {
      await sb('rpc/dt_set_password', { method: 'POST', body: JSON.stringify({ p_id: targetId, p_mat_khau: pwVal }) });
    }
    toggleAddUserForm();
    await loadUsers();
  } catch (e) {
    errEl.textContent = e.message.includes('duplicate') ? 'Mã số nhân viên này đã tồn tại.' : 'Có lỗi xảy ra: ' + e.message;
    errEl.style.display = 'block';
  }
}

// ---------- Sửa tại chỗ (không nhảy vị trí trang) ----------
function editUserInline(id) {
  if (openEditId && openEditId !== id) closeInlineEdit(openEditId);
  const existing = document.getElementById(`edit-row-${id}`);
  if (existing) { closeInlineEdit(id); return; }
  const u = allUsersCache.find(x => x.id === id);
  if (!u) return;
  const row = document.getElementById(`user-row-${id}`);
  const hasPw = passwordIds.has(id);
  const html = `
    <tr id="edit-row-${id}"><td colspan="8">
      <div class="form-grid" style="border-bottom:none;padding:16px 4px;">
        <p class="form-err" id="edit-err-${id}"></p>
        <div><label>Mã số nhân viên</label><input value="${u.ma_so_nhan_vien}" disabled></div>
        <div><label>Họ tên *</label><input id="edit-hoten-${id}" value="${u.ho_ten}"></div>
        <div><label>Phòng/Khoa</label><input id="edit-phongkhoa-${id}" value="${u.phong_khoa || ''}"></div>
        <div><label>Chức vụ</label><input id="edit-chucvu-${id}" value="${u.chuc_vu || ''}"></div>
        <div><label>Số điện thoại</label><input id="edit-sdt-${id}" value="${u.so_dien_thoai || ''}"></div>
        <div><label>Vai trò</label>
          <select id="edit-vaitro-${id}">
            <option value="hoc_vien" ${u.vai_tro === 'hoc_vien' ? 'selected' : ''}>Học viên</option>
            <option value="admin" ${u.vai_tro === 'admin' ? 'selected' : ''}>Quản trị viên</option>
          </select>
        </div>
        <div class="full">
          <label style="display:flex;align-items:center;gap:7px;"><input type="checkbox" id="edit-theodoicme-${id}" style="width:auto;" ${u.theo_doi_cme !== false ? 'checked' : ''}> Theo dõi CME (bỏ tick nếu là nhân sự không thuộc khối chuyên môn)</label>
        </div>
        <div class="full">
          <label style="display:flex;align-items:center;gap:7px;"><input type="checkbox" id="edit-needpw-${id}" style="width:auto;" ${hasPw ? 'checked' : ''} onchange="document.getElementById('edit-pw-wrap-${id}').style.display = this.checked ? 'block' : 'none'"> Yêu cầu mật khẩu để đăng nhập</label>
        </div>
        <div class="full" id="edit-pw-wrap-${id}" style="display:${hasPw ? 'block' : 'none'}">
          <label>Mật khẩu${hasPw ? ' (để trống nếu giữ nguyên mật khẩu cũ)' : ''}</label>
          <input id="edit-password-${id}" type="text" placeholder="Nhập mật khẩu">
        </div>
        <div class="form-actions">
          <button class="btn-save" onclick="saveUserInline('${id}')">Lưu</button>
          <button class="btn-cancel" onclick="closeInlineEdit('${id}')">Huỷ</button>
        </div>
      </div>
    </td></tr>`;
  row.insertAdjacentHTML('afterend', html);
  openEditId = id;
  document.getElementById(`edit-hoten-${id}`).focus();
}

function closeInlineEdit(id) {
  const el = document.getElementById(`edit-row-${id}`);
  if (el) el.remove();
  if (openEditId === id) openEditId = null;
}

async function saveUserInline(id) {
  const errEl = document.getElementById(`edit-err-${id}`);
  errEl.style.display = 'none';
  const hoten = document.getElementById(`edit-hoten-${id}`).value.trim();
  if (!hoten) {
    errEl.textContent = 'Họ tên không được để trống.';
    errEl.style.display = 'block';
    return;
  }
  const needPw = document.getElementById(`edit-needpw-${id}`).checked;
  const pwVal = document.getElementById(`edit-password-${id}`).value.trim();
  const hadPw = passwordIds.has(id);
  if (needPw && !pwVal && !hadPw) {
    errEl.textContent = 'Vui lòng nhập mật khẩu cho tài khoản này.';
    errEl.style.display = 'block';
    return;
  }
  const payload = {
    ho_ten: hoten,
    phong_khoa: document.getElementById(`edit-phongkhoa-${id}`).value.trim() || null,
    chuc_vu: document.getElementById(`edit-chucvu-${id}`).value.trim() || null,
    so_dien_thoai: document.getElementById(`edit-sdt-${id}`).value.trim() || null,
    vai_tro: document.getElementById(`edit-vaitro-${id}`).value,
    theo_doi_cme: document.getElementById(`edit-theodoicme-${id}`).checked
  };
  try {
    await sb(`dt_user_profiles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(payload), prefer: 'return=minimal' });
    if (needPw && pwVal) {
      await sb('rpc/dt_set_password', { method: 'POST', body: JSON.stringify({ p_id: id, p_mat_khau: pwVal }) });
      passwordIds.add(id);
    } else if (!needPw && hadPw) {
      await sb('rpc/dt_set_password', { method: 'POST', body: JSON.stringify({ p_id: id, p_mat_khau: null }) });
      passwordIds.delete(id);
    }
    const idx = allUsersCache.findIndex(x => x.id === id);
    if (idx > -1) allUsersCache[idx] = { ...allUsersCache[idx], ...payload };
    closeInlineEdit(id);
    document.getElementById(`user-row-${id}`).outerHTML = userRowHTML(allUsersCache[idx]);
  } catch (e) {
    errEl.textContent = 'Có lỗi xảy ra: ' + e.message;
    errEl.style.display = 'block';
  }
}

// ---------- Ngừng / Kích hoạt / Xoá vĩnh viễn ----------
async function toggleUserStatus(id, isCurrentlyActive) {
  const u = allUsersCache.find(x => x.id === id);
  const newStatus = isCurrentlyActive ? 'ngung_hoat_dong' : 'hoat_dong';
  const confirmMsg = isCurrentlyActive
    ? `Ngừng hoạt động tài khoản "${u ? u.ho_ten : ''}"? Người này sẽ không đăng nhập được nữa, nhưng toàn bộ dữ liệu và lịch sử học vẫn được giữ nguyên. Có thể kích hoạt lại bất cứ lúc nào.`
    : `Kích hoạt lại tài khoản "${u ? u.ho_ten : ''}"?`;
  if (!confirm(confirmMsg)) return;
  try {
    await sb(`dt_user_profiles?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ trang_thai: newStatus }), prefer: 'return=minimal' });
    const idx = allUsersCache.findIndex(x => x.id === id);
    if (idx > -1) {
      allUsersCache[idx] = { ...allUsersCache[idx], trang_thai: newStatus };
      document.getElementById(`user-row-${id}`).outerHTML = userRowHTML(allUsersCache[idx]);
    }
  } catch (e) {
    alert('Có lỗi xảy ra: ' + e.message);
  }
}

async function deleteUser(id, name) {
  if (!confirm(`Xoá VĨNH VIỄN tài khoản "${name}"? Toàn bộ thông tin tài khoản sẽ mất hẳn, không thể khôi phục.\n\nNếu chỉ muốn tạm khoá (ví dụ học viên nghỉ việc) nhưng vẫn giữ lịch sử học, hãy dùng nút "Ngừng" thay vì xoá.`)) return;
  try {
    await sb(`dt_user_profiles?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    allUsersCache = allUsersCache.filter(x => x.id !== id);
    const row = document.getElementById(`user-row-${id}`);
    if (row) row.remove();
    closeInlineEdit(id);
  } catch (e) {
    alert('Không xoá được: ' + e.message);
  }
}
</script>
